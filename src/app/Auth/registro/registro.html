<section class="register-page">
  <p-card styleClass="register-card">
    <ng-template #title>Creá tu cuenta</ng-template>
    <ng-template #subtitle>Sumate a la comunidad de Tercer Tiempo</ng-template>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="register-name">Nombre completo</label>
      <input id="register-name" pInputText formControlName="nombre" autocomplete="name" placeholder="Tu nombre" />

      <label for="register-email">Correo electrónico</label>
      <input id="register-email" pInputText type="email" formControlName="email" autocomplete="email" placeholder="nombre@correo.com" />

      <label for="register-password">Contraseña</label>
      <p-password inputId="register-password" formControlName="password" [toggleMask]="true" promptLabel="Usá 8 caracteres o más" weakLabel="Débil" mediumLabel="Media" strongLabel="Segura" />

      <label for="register-confirm">Confirmar contraseña</label>
      <p-password inputId="register-confirm" formControlName="confirmar" [feedback]="false" [toggleMask]="true" />
      @if (passwordMismatch()) { <small class="field-error">Las contraseñas no coinciden.</small> }

      <p-button label="Crear mi cuenta" icon="pi pi-user-plus" type="submit" [loading]="loading()" />
      <p class="switch-copy">¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a></p>
    </form>
  </p-card>
  <div class="benefits-copy">
    <span>COMUNIDAD 3T</span>
    <div class="display-title">Todo tu fútbol, en una cuenta.</div>
    <ul>
      <li>Guardá tus favoritos</li>
      <li>Revisá compras y tickets</li>
      <li>Accedé a ofertas exclusivas</li>
    </ul>
  </div>
</section>
