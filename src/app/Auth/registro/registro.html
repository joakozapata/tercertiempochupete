<section class="auth-container">
  <!-- Columna Izquierda: Banner con los beneficios (igual que en inicio de sesión) -->
  <div class="auth-banner">
    <div class="banner-content">
      <span>COMUNIDAD 3T</span>
      <h1>TODO TU FÚTBOL, EN UNA CUENTA.</h1>
      <ul>
        <li>Guardá tus favoritos</li>
        <li>Revisá compras y tickets</li>
        <li>Accedé a ofertas exclusivas</li>
      </ul>
    </div>
  </div>

  <!-- Columna Derecha: Tarjeta de Registro con PrimeNG -->
  <div class="auth-form-wrapper">
    <p-card styleClass="auth-card">
      <ng-template #header>
        <div class="auth-header">
          <h2>Creá tu cuenta</h2>
          <p>Sumate a la comunidad de Tercer Tiempo</p>
        </div>
      </ng-template>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        
        <div class="field">
          <label for="register-name">Nombre completo</label>
          <input 
            id="register-name" 
            pInputText 
            formControlName="nombre" 
            autocomplete="name" 
            placeholder="Tu nombre" 
            class="w-full"
          />
        </div>

        <div class="field">
          <label for="register-email">Correo electrónico</label>
          <input 
            id="register-email" 
            pInputText 
            type="email" 
            formControlName="email" 
            autocomplete="email" 
            placeholder="nombre@correo.com" 
            class="w-full"
          />
        </div>

        <div class="field">
          <label for="register-password">Contraseña</label>
          <p-password 
            inputId="register-password" 
            formControlName="password" 
            [toggleMask]="true" 
            promptLabel="Usá 8 caracteres o más" 
            weakLabel="Débil" 
            mediumLabel="Media" 
            strongLabel="Segura"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
        </div>

        <div class="field">
          <label for="register-confirm">Confirmar contraseña</label>
          <p-password 
            inputId="register-confirm" 
            formControlName="confirmar" 
            [feedback]="false" 
            [toggleMask]="true"
            placeholder="Repite tu contraseña"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          @if (passwordMismatch()) { 
            <small class="p-error">Las contraseñas no coinciden.</small> 
          }
        </div>

        <div class="form-actions">
          <p-button 
            label="Crear mi cuenta" 
            icon="pi pi-user-plus" 
            type="submit" 
            [loading]="loading()"
            styleClass="w-full p-button-success" 
          />
        </div>

        <div class="auth-footer">
          <span>¿Ya tenés cuenta?</span>
          <a routerLink="/inicioSesion" class="auth-link">Iniciá sesión</a>
        </div>

      </form>
    </p-card>
  </div>
</section>
