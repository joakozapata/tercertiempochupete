<div class="container mx-auto p-4 flex justify-content-center">
  <p-card header="Mi Perfil de Usuario" class="w-full md:w-6 shadow-md">
    
    @if (auth.user(); as usuario) {
      <div class="flex flex-col gap-4">
        <div class="flex align-items-center gap-3">
          <i class="pi pi-user text-4xl text-primary"></i>
          <div>
            <h3 class="m-0 text-xl font-bold">{{ usuario.nombre }}</h3>
            <p class="m-0 text-gray-500">{{ usuario.email }}</p>
          </div>
        </div>

        <div class="flex align-items-center gap-2 mt-2">
          <span class="font-semibold">Rol en el sistema:</span>
          <p-tag [severity]="usuario.rol === 'admin' ? 'danger' : 'info'" [value]="usuario.rol | uppercase"></p-tag>
        </div>

        <div class="flex justify-content-between mt-4">
          @if (auth.isAdmin()) {
            <p-button label="Panel de Administración" icon="pi pi-cog" severity="secondary" routerLink="/admin"></p-button>
          }
          <p-button label="Cerrar Sesión" icon="pi pi-sign-out" severity="danger" (onClick)="logout()"></p-button>
        </div>
      </div>
    } @else {
      <div class="text-center p-4">
        <p>No hay una sesión activa.</p>
        <p-button label="Iniciar Sesión" icon="pi pi-sign-in" routerLink="/auth/inicio-sesion" class="mt-2"></p-button>
      </div>
    }

  </p-card>
</div>
