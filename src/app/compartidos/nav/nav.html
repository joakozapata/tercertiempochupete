<p-menubar [model]="items" styleClass="store-menubar">
  <ng-template #start>
    <a routerLink="/inicio" class="brand">
      <span class="brand-mark">TT</span>
      <span class="brand-text">TERCER <b>TIEMPO</b></span>
    </a>
  </ng-template>

  <ng-template #end>
    <div class="nav-actions">
      <a routerLink="/carrito" class="nav-cart" title="Ver carrito">
        <i class="pi pi-shopping-cart"></i>
        Carrito
        @if (cantidadItems() > 0) {
          <p-badge [value]="cantidadItems().toString()" />
        }
      </a>

      @if (isLoggedIn()) {
        <span class="nav-user">
          <i class="pi pi-user"></i>
          {{ nombreUsuario() || "Mi cuenta" }}
        </span>
        <p-button
          label="Salir"
          icon="pi pi-sign-out"
          styleClass="nav-logout"
          (onClick)="logout()"
        />
      } @else {
        <p-button
          label="Ingresar"
          icon="pi pi-sign-in"
          routerLink="/inicioSesion"
          styleClass="btn-emerald"
        />
      }
    </div>
  </ng-template>
</p-menubar>
