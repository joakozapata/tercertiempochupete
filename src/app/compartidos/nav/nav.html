<p-menubar [model]="items" styleClass="store-menubar">
  <ng-template #start>
    <a routerLink="/inicio" class="brand">
      <span class="brand-mark">3T</span>
      <span class="brand-text">TERCER <b>TIEMPO</b></span>
    </a>
  </ng-template>

  <ng-template #end>
    <div class="nav-actions">
      @if (isAdmin()) {
        <a routerLink="/admin" class="nav-admin">
          <i class="pi pi-cog" aria-hidden="true"></i>
          <span>Administrar productos</span>
        </a>
      }

      <a routerLink="/carrito" class="nav-cart" title="Ver carrito">
        <svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.5a2 2 0 0 0 1.9-1.4L22 8H6" />
          <circle cx="10" cy="20" r="1.4" />
          <circle cx="18" cy="20" r="1.4" />
        </svg>
        <span>Carrito</span>
        @if (cantidadItems() > 0) {
          <p-badge [value]="cantidadItems().toString()" />
        }
      </a>

      @if (isLoggedIn()) {
        <span class="nav-user">
          <span class="account-label">Mi cuenta</span>
          @if (nombreUsuario()) {
            <span class="account-name">{{ nombreUsuario() }}</span>
          }
        </span>
        <p-button
          label="Salir"
          styleClass="nav-logout"
          (onClick)="logout()"
        />
      } @else {
        <p-button
          label="Ingresar"
          icon="pi pi-sign-in"
          routerLink="/inicioSesion"
          styleClass="btn-emerald"
        />
      }
    </div>
  </ng-template>
</p-menubar>
