<p-menubar [model]="items()" styleClass="store-menubar">

  <ng-template #start>
    <a routerLink="/" class="brand" aria-label="Tercer Tiempo, inicio">
      <span class="brand-mark">3T</span>
      <span class="brand-text">TERCER <b>TIEMPO</b></span>
    </a>
  </ng-template>

  <ng-template #end>
    <div class="nav-actions">

      <!-- Carrito: siempre visible -->
      <p-button
        [icon]="cart.count() > 0 ? 'pi pi-shopping-bag' : 'pi pi-trash'"
        [text]="true"
        routerLink="/carrito"
        [ariaLabel]="cart.count() > 0 ? 'Carrito con ' + cart.count() + ' productos' : 'Carrito vacío'"
        [badge]="cart.count() > 0 ? cart.count().toString() : undefined"
        badgeSeverity="success"
        styleClass="nav-cart"
      />

      @if (auth.isAuthenticated()) {
        <p-button
          [label]="auth.user()?.nombre || 'Mi cuenta'"
          icon="pi pi-user"
          [text]="true"
          routerLink="/perfil"
          styleClass="nav-user"
        />

        <p-button
          label="Salir"
          icon="pi pi-sign-out"
          severity="secondary"
          [text]="true"
          (onClick)="logout()"
          styleClass="nav-logout"
        />
      } @else {
        <p-button 
          label="Ingresar" 
          icon="pi pi-sign-in" 
          styleClass="p-button-outlined nav-logout" 
          routerLink="/inicioSesion"
        />
      }

    </div>
  </ng-template>

</p-menubar>
